<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>სანდრო — 2</title>
<meta name="description" content="სანდრო რაძმაძე · ორი წელი">
<meta name="theme-color" content="#F4F0E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Sans+Georgian:wght@300;400&family=Noto+Serif+Georgian:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F0E8;
    --bg-2:#ECE6DA;
    --ink:#151515;
    --ink-2:#6E6A63;
    --line:rgba(21,21,21,.14);
    --dark:#121212;
    --accent:#B4472F;
    --serif:"Noto Serif Georgian",Georgia,serif;
    --sans:"Noto Sans Georgian",system-ui,-apple-system,sans-serif;
    --display:"Bodoni Moda",Didot,"Times New Roman",serif;
    --ease:cubic-bezier(.22,.8,.18,1);
    --gutter:clamp(18px,4.5vw,64px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;
    line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  body.locked{overflow:hidden;height:100svh}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  ::selection{background:var(--ink);color:var(--bg)}

  .label{
    font-family:var(--sans);font-size:.7rem;font-weight:400;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ink-2);
  }

  /* ───── Intro curtain ───── */
  .intro{
    position:fixed;inset:0;z-index:50;background:var(--dark);color:#EDE8DF;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:max(28px,env(safe-area-inset-top)) var(--gutter) max(28px,env(safe-area-inset-bottom));
    transition:transform 1.4s var(--ease);
  }
  .intro.hide{transform:translateY(-100%)}
  .intro .center{text-align:center}
  .intro .num{
    font-family:var(--display);font-weight:400;line-height:.8;
    font-size:clamp(11rem,46vw,22rem);letter-spacing:-.04em;
    opacity:0;animation:fade 1.6s .2s var(--ease) forwards;
  }
  .intro .name{
    margin-top:clamp(26px,4vw,40px);font-family:var(--serif);font-weight:300;
    font-size:clamp(1.9rem,7.4vw,3.2rem);letter-spacing:.04em;line-height:1.2;
    display:flex;flex-wrap:wrap;justify-content:center;column-gap:.4em;
  }
  .intro .name .w{display:inline-flex}
  .intro .name .ch{
    display:inline-block;opacity:0;transform:translateY(.55em);filter:blur(10px);
    animation:letter 1.1s var(--ease) forwards;animation-delay:calc(.9s + var(--i) * .075s);
  }
  @keyframes letter{to{opacity:1;transform:none;filter:blur(0)}}
  .intro .rule{
    width:56px;height:1px;margin:clamp(22px,3vw,30px) auto 0;background:rgba(237,232,223,.45);
    transform:scaleX(0);animation:draw 1.2s 2.1s var(--ease) forwards;
  }
  @keyframes draw{to{transform:scaleX(1)}}
  .open-btn{
    margin-top:clamp(34px,5vw,48px);display:inline-flex;align-items:center;
    padding:15px 30px;border:1px solid rgba(237,232,223,.35);border-radius:999px;
    font-size:.86rem;letter-spacing:.06em;color:#EDE8DF;white-space:nowrap;
    transition:background .5s, color .5s, border-color .5s;
    opacity:0;animation:fade 1.4s 2.4s var(--ease) forwards;
  }
  .open-btn:hover{background:#EDE8DF;color:var(--dark);border-color:#EDE8DF}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* ───── Top bar ───── */
  .bar{
    position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;justify-content:center;align-items:center;text-align:center;
    padding:max(22px,env(safe-area-inset-top)) var(--gutter) 22px;
    mix-blend-mode:difference;color:#fff;pointer-events:none;
  }
  .bar .name{
    font-family:var(--serif);font-weight:400;color:#fff;
    font-size:clamp(1.05rem,2.6vw,1.45rem);letter-spacing:.16em;line-height:1;
  }

  /* ───── Hero ───── */
  .hero{
    min-height:100svh;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;
  }
  .hero-text{
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:120px var(--gutter) clamp(40px,7vw,90px);
  }
  .hero h1{
    font-family:var(--serif);font-weight:300;line-height:1.02;letter-spacing:-.02em;
    font-size:clamp(3.4rem,8.4vw,8.4rem);
  }
  .hero .two{
    font-family:var(--display);font-weight:400;font-style:italic;
    font-size:clamp(5rem,13vw,13rem);line-height:.8;color:var(--accent);
    margin-bottom:clamp(14px,2vw,26px);
  }
  .hero .rule{width:64px;height:1px;background:var(--ink);margin:clamp(26px,3vw,40px) 0 22px}
  .hero p{font-family:var(--serif);font-weight:300;font-size:clamp(1rem,1.5vw,1.2rem);color:var(--ink-2);max-width:34ch}
  .hero-photo{position:relative;overflow:hidden;background:var(--bg-2)}
  .hero-photo img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 35%;
    transform:scale(1.12);transition:transform 3.2s var(--ease);
  }
  body.opened .hero-photo img{transform:scale(1)}
  .hero-photo{clip-path:circle(0% at 50% 50%);transition:clip-path 2s .15s var(--ease)}
  body.opened .hero-photo{clip-path:circle(75% at 50% 50%)}

  .rise{opacity:0;transform:translateY(26px);transition:opacity 1.4s var(--ease), transform 1.4s var(--ease)}
  body.opened .rise{opacity:1;transform:none}
  body.opened .rise.d1{transition-delay:.55s}
  body.opened .rise.d2{transition-delay:.75s}
  body.opened .rise.d3{transition-delay:.95s}
  body.opened .rise.d4{transition-delay:1.15s}

  /* ───── Section heads ───── */
  section{padding:clamp(90px,14vw,180px) var(--gutter)}
  .head{
    display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px;
    border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:clamp(34px,5vw,64px);
  }
  .head h2{font-family:var(--serif);font-weight:300;font-size:clamp(1.9rem,4.4vw,3.4rem);line-height:1.1;letter-spacing:-.01em}

  /* ───── Gallery: pinned stage, photos open one by one ───── */
  .gallery{position:relative;padding:0 0 0}
  .gallery-intro{padding:clamp(90px,14vw,180px) var(--gutter) 0}
  .track{position:relative}
  .stage{
    position:sticky;top:0;height:100svh;overflow:hidden;
    display:grid;place-items:center;
  }
  .frame{
    position:relative;width:min(84vw,calc(78svh * .8));aspect-ratio:4/5;
  }
  .shot{
    position:absolute;inset:0;overflow:hidden;background:var(--bg-2);cursor:zoom-in;
    --p:0;--q:0;
    clip-path:circle(calc(var(--p) * 75%) at 50% 50%);
    -webkit-clip-path:circle(calc(var(--p) * 75%) at 50% 50%);
    transform:scale(calc(1 - var(--q) * .1));
    filter:brightness(calc(1 - var(--q) * .45));
    will-change:clip-path,transform;
  }
  .shot img{
    width:100%;height:100%;object-fit:cover;
    transform:scale(calc(1.3 - var(--p) * .3)) rotate(calc((1 - var(--p)) * -8deg));
    will-change:transform;
  }
  .ghost{
    position:absolute;left:var(--gutter);bottom:max(26px,env(safe-area-inset-bottom));
    font-family:var(--display);font-size:clamp(1rem,1.6vw,1.2rem);color:var(--ink-2);
    display:flex;align-items:center;gap:14px;
  }
  .ghost .num{color:var(--ink);min-width:1.4em}
  .ghost .track-line{position:relative;width:clamp(60px,10vw,140px);height:1px;background:var(--line)}
  .ghost .track-line i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:0}
  .big-index{
    position:absolute;right:var(--gutter);top:50%;transform:translateY(-50%);
    font-family:var(--display);font-style:italic;font-size:clamp(5rem,14vw,13rem);line-height:1;
    color:transparent;-webkit-text-stroke:1px rgba(21,21,21,.18);pointer-events:none;
    transition:opacity .5s;
  }

  .fade{opacity:0;transform:translateY(24px);transition:opacity 1.3s var(--ease), transform 1.3s var(--ease)}
  .fade.in{opacity:1;transform:none}

  /* ───── Closing ───── */
  .closing{text-align:center;padding-bottom:clamp(120px,16vw,200px)}
  .closing h3{
    font-family:var(--serif);font-weight:300;line-height:1.05;letter-spacing:-.02em;
    font-size:clamp(2.6rem,9vw,7.5rem);
  }
  .closing .heart{color:var(--accent);font-family:var(--display);font-size:.8em}
  .closing .note{
    margin:clamp(34px,5vw,56px) auto 0;max-width:32ch;
    font-family:var(--serif);font-weight:300;font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1.7;color:var(--ink-2);
  }
  .closing .note em{font-family:var(--display);font-style:italic;color:var(--accent);font-size:1.25em}
  .closing .credit{
    margin:clamp(70px,10vw,120px) auto 0;padding-top:26px;border-top:1px solid var(--line);
    width:min(100%,360px);display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .closing .credit .who{font-family:var(--display);font-size:clamp(1.05rem,2.2vw,1.3rem);letter-spacing:.02em}

  /* ───── Sound toggle ───── */
  .sound{
    position:fixed;z-index:40;
    right:max(var(--gutter),env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:999px;
    background:rgba(244,240,232,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);
    opacity:0;transform:translateY(10px);transition:opacity .8s 1.4s, transform .8s 1.4s var(--ease);
  }
  body.opened .sound{opacity:1;transform:none}
  .wave{display:flex;align-items:center;gap:2px;height:12px}
  .wave i{width:1.5px;height:100%;background:var(--ink);transform-origin:center;animation:wv 1.2s ease-in-out infinite}
  .wave i:nth-child(2){animation-delay:-.4s}.wave i:nth-child(3){animation-delay:-.8s}.wave i:nth-child(4){animation-delay:-.2s}
  @keyframes wv{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  .sound.off .wave i{animation-play-state:paused;transform:scaleY(.3)}

  /* ───── Lightbox ───── */
  .lb{
    position:fixed;inset:0;z-index:60;background:rgba(14,14,14,.96);
    display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .5s, visibility .5s;
    touch-action:pan-y;
  }
  .lb.open{opacity:1;visibility:visible}
  .lb img{max-width:min(92vw,1100px);max-height:82svh;object-fit:contain;transition:opacity .35s}
  .lb .ctl{
    position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;align-items:center;gap:28px;color:#EDE8DF;
  }
  .lb .ctl button{width:44px;height:44px;display:grid;place-items:center;opacity:.7;transition:opacity .3s}
  .lb .ctl button:hover{opacity:1}
  .lb .count{font-family:var(--display);font-size:1rem;min-width:70px;text-align:center}
  .lb .x{position:absolute;top:max(16px,env(safe-area-inset-top));right:var(--gutter);color:#EDE8DF;width:44px;height:44px;display:grid;place-items:center;opacity:.7}
  .lb .x:hover{opacity:1}

  /* ───── Mobile ───── */
  @media (max-width:820px){
    .hero{grid-template-columns:1fr;grid-template-rows:auto auto;min-height:auto}
    .hero-photo{order:-1;height:72svh;min-height:420px}
    .hero-text{padding:44px var(--gutter) 20px}
    .frame{width:86vw;aspect-ratio:3/4;max-height:74svh}
    .big-index{display:none}
    .head{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  }
</style>
</head>
<body class="locked">

<div class="intro" id="intro">
  <div class="center">
    <div class="num">2</div>
    <h1 class="name" id="introName" aria-label="სანდრო რაძმაძე">სანდრო რაძმაძე</h1>
    <div class="rule"></div>
    <button class="open-btn" id="openBtn">გახსენი და აუწიე ხმას</button>
  </div>
</div>

<div class="bar" aria-hidden="true"><span class="name">სანდრო რაძმაძე</span></div>

<main>
  <header class="hero">
    <div class="hero-text">
      <div class="two rise d1">2</div>
      <h1 class="rise d2">სანდრო</h1>
      <div class="rule rise d3"></div>
      <p class="rise d4">გილოცავ დაბადების დღეს.</p>
    </div>
    <div class="hero-photo"><img src="photos/main.jpg" alt="სანდრო"></div>
  </header>

  <section class="gallery">
    <div class="gallery-intro">
      <div class="head fade">
        <h2>ორი წელი</h2>
        <span class="label">01 — 12</span>
      </div>
    </div>
    <div class="track" id="track">
      <div class="stage">
        <div class="big-index" id="bigIdx">01</div>
        <div class="frame" id="frame"></div>
        <div class="ghost"><span class="num" id="gNum">01</span><span class="track-line"><i id="gBar"></i></span><span>12</span></div>
      </div>
    </div>
  </section>

  <section class="closing">
    <h3 class="fade">გილოცავ სანდრო<br>და მიყვარხარ <span class="heart">♥</span></h3>
    <p class="note fade">მეორე წელიც მოვღუნეთ ბებერ.<br>ქალებში წასვლამდე <span style="white-space:nowrap">დარჩენილია <em>13</em> წელი.</span></p>
    <div class="credit fade"><span class="label">Author</span><span class="who">Nikoloz Omanidze Production</span></div>
  </section>
</main>

<button class="sound" id="sound" aria-label="ხმა"><span class="wave"><i></i><i></i><i></i><i></i></span><span id="soundTxt">ხმა</span></button>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" id="lbX" aria-label="დახურვა">
    <svg width="20" height="20" viewBox="0 0 20 20" stroke="currentColor" stroke-width="1.2"><path d="M3 3l14 14M17 3 3 17"/></svg>
  </button>
  <img id="lbImg" alt="">
  <div class="ctl">
    <button id="lbPrev" aria-label="წინა"><svg width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M21 6H1m5-5L1 6l5 5"/></svg></button>
    <span class="count" id="lbCount"></span>
    <button id="lbNext" aria-label="შემდეგი"><svg width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1 6h20m-5-5 5 5-5 5"/></svg></button>
  </div>
</div>

<audio id="song" src="music.mp3" loop preload="auto" playsinline></audio>

<script>
/* intro name: letter-by-letter */
(() => {
  const el = document.getElementById("introName"); let k = 0;
  el.innerHTML = el.textContent.trim().split(" ").map(w =>
    `<span class="w" aria-hidden="true">${[...w].map(c => `<span class="ch" style="--i:${k++}">${c}</span>`).join("")}</span>`
  ).join("");
})();
/* ფოტოები: photos/1.jpg … photos/12.jpg (მთავარი — photos/main.jpg) */
const PHOTOS = Array.from({length:12}, (_, i) => `photos/${i + 1}.jpg`);
const pad = n => String(n).padStart(2, "0");
const N = PHOTOS.length;

const frame = document.getElementById("frame"), track = document.getElementById("track");
const shots = PHOTOS.map((src, i) => {
  const el = document.createElement("figure");
  el.className = "shot"; el.dataset.i = i; el.style.zIndex = i + 1;
  el.innerHTML = `<img src="${src}" alt="სანდრო ${pad(i+1)}" decoding="async"${i > 2 ? ' loading="lazy"' : ''}>`;
  frame.appendChild(el);
  return el;
});

/* fade-ins */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
}), { threshold: .15, rootMargin: "0px 0px -6% 0px" });
document.querySelectorAll(".fade").forEach(el => io.observe(el));

/* pinned gallery: each photo opens from a circle, one after another */
const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
const SEG = () => innerHeight * .9;          // scroll distance per photo
const sizeTrack = () => { track.style.height = (N * SEG() + innerHeight * .6) + "px"; };
sizeTrack(); addEventListener("resize", sizeTrack);

const clamp = x => Math.min(1, Math.max(0, x));
const easeIO = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const gNum = document.getElementById("gNum"), gBar = document.getElementById("gBar"), bigIdx = document.getElementById("bigIdx");
let smooth = null, active = 0;

function loop(){
  const seg = SEG();
  const target = -track.getBoundingClientRect().top + seg;   // first photo opens as the stage arrives
  smooth = smooth === null || reduced ? target : smooth + (target - smooth) * .1;
  const ps = shots.map((_, i) => clamp((smooth - i * seg) / (seg * .85)));
  shots.forEach((el, i) => {
    const p = easeIO(ps[i]), q = i < N - 1 ? easeIO(ps[i + 1]) : 0;
    el.style.setProperty("--p", p.toFixed(4));
    el.style.setProperty("--q", q.toFixed(4));
  });
  let a = 0; ps.forEach((p, i) => { if (p > .5) a = i; });
  if (a !== active){ active = a; gNum.textContent = bigIdx.textContent = pad(a + 1); }
  gBar.style.width = (clamp(smooth / (N * seg)) * 100) + "%";
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* lightbox */
const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), lbCount = document.getElementById("lbCount");
let cur = 0;
function show(i){
  cur = (i + PHOTOS.length) % PHOTOS.length;
  lbImg.style.opacity = 0;
  const src = PHOTOS[cur];
  const im = new Image(); im.onload = () => { lbImg.src = src; lbImg.style.opacity = 1; }; im.src = src;
  lbCount.textContent = `${pad(cur+1)} / ${pad(PHOTOS.length)}`;
}
frame.addEventListener("click", () => { show(active); lb.classList.add("open"); });
const closeLb = () => lb.classList.remove("open");
document.getElementById("lbX").onclick = closeLb;
document.getElementById("lbPrev").onclick = e => { e.stopPropagation(); show(cur - 1); };
document.getElementById("lbNext").onclick = e => { e.stopPropagation(); show(cur + 1); };
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") show(cur - 1);
  if (e.key === "ArrowRight") show(cur + 1);
});
let tx = null;
lb.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
});

/* music */
const song = document.getElementById("song"), sound = document.getElementById("sound"), soundTxt = document.getElementById("soundTxt");
let userOff = false;
function fadeIn(){
  song.volume = 0; const t0 = performance.now();
  (function s(t){ const p = Math.min(1, (t - t0) / 2000); song.volume = p; if (p < 1) requestAnimationFrame(s); })(t0);
}
function setUI(on){ sound.classList.toggle("off", !on); }
function play(){ song.play().then(() => { fadeIn(); setUI(true); }).catch(() => setUI(false)); }
sound.addEventListener("click", () => {
  if (song.paused){ userOff = false; play(); } else { userOff = true; song.pause(); setUI(false); }
});
document.addEventListener("visibilitychange", () => {
  if (!document.body.classList.contains("opened")) return;
  if (document.hidden) song.pause(); else if (!userOff) play();
});

document.getElementById("openBtn").addEventListener("click", () => {
  play();
  document.getElementById("intro").classList.add("hide");
  document.body.classList.remove("locked");
  document.body.classList.add("opened");
});
</script>
</body>
</html>
